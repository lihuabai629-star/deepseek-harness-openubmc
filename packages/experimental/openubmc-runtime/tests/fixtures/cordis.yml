- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: llm-deepseek
  disabled: true
- insert:
    - id: case-model
      name: './model.ts'
    - id: openubmc-policy
      name: '@deepseek-ai/dsh-experimental-openubmc-runtime'
      config:
        serverName: openubmc-target-runtime
        operationDeadlineSeconds: 600
        completionGraceMs: 60000
        workflowMaxSteps: 1
        evidenceReadLimitBytes: 65536
    - id: openubmc-runtime
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: openubmc-target-runtime
        command: !!js process.execPath
        args: !!js "[process.env.DSH_CASE_RUNTIME_FIXTURE]"
        toolCallTimeoutMs: 660000
        sessionIdMetadataKey: taskId
        requiredToolCallPolicies: [openubmc-session-authority]
        structuredContentInText: true
        structuredContentInMeta: true
        failOnStartupError: true
        reconnect:
          enabled: false

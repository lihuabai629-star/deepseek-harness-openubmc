- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: llm-deepseek
  disabled: true
- insert:
    - id: case-model
      name: './model.ts'
    - id: openubmc-cases
      name: '@deepseek-ai/dsh-experimental-openubmc-cases'
      config:
        serverName: openubmc-target-runtime
    - id: openubmc-runtime
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: openubmc-target-runtime
        command: !!js process.execPath
        args: !!js "[process.env.DSH_CASE_RUNTIME_FIXTURE]"
        sessionIdMetadataKey: taskId
        structuredContentInText: true
        structuredContentInMeta: true
        failOnStartupError: true
        reconnect:
          enabled: false
